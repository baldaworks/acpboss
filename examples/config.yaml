runtime:
  providers:
    codex:
      cmd: "npx -y codex-acp@1.11.0"
    opencode:
      cmd: "opencode acp"
acpboss:
  working_dir: .
  http:
    listen: 127.0.0.1:8080
  startup_timeout: 60s
  request_timeout: 5m
  shutdown_timeout: 10s
  max_in_flight: 32
  max_sessions: 128
  max_message_bytes: 8388608
